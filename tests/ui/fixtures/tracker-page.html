<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Fixture tracker page</title>
  <style>
    body { font: 14px sans-serif; margin: 20px; height: 3000px; }
    .carousel { width: 300px; overflow-x: scroll; white-space: nowrap; }
    .carousel span { display: inline-block; width: 120px; }
  </style>
</head>
<body>
  <!-- Like torrentgalaxy's featured strip: scrolls by itself, firing scroll events non-stop. -->
  <div class="carousel" id="carousel"><span>One</span><span>Two</span><span>Three</span><span>Four</span><span>Five</span></div>
  <p><a id="cached-magnet" href="magnet:?xt=urn:btih:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa&dn=Cached.Release">Cached release (magnet)</a></p>
  <p><a id="plain-magnet" href="magnet:?xt=urn:btih:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb&dn=Other.Release">Other release (magnet)</a></p>
  <!-- A link flush with the right edge, where the badge would run off the window. -->
  <p style="text-align: right"><a id="edge-magnet" href="magnet:?xt=urn:btih:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa&dn=Edge">Edge</a></p>
  <script>
    const carousel = document.getElementById("carousel");
    setInterval(() => (carousel.scrollLeft = (carousel.scrollLeft + 5) % 300), 20);
  </script>
</body>
</html>
